<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1143 228" width="1143" height="228" class="sy-diagram" role="img" aria-label="Fetch statechart">
<style>.sy-diagram{font:12px ui-sans-serif,system-ui,sans-serif;color:#1e293b}.sy-state rect,.sy-state circle{fill:#fff;stroke:#64748b;stroke-width:1.25}.sy-state .sy-inner{fill:none}.sy-state text{fill:currentColor}.sy-title{font-weight:600}.sy-compound>rect,.sy-parallel>rect{fill:#f8fafc}.sy-active>rect,.sy-active>circle{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}.sy-initial{fill:#334155}.sy-transition path{fill:none;stroke:#64748b;stroke-width:1.25}#sy-arrow path{fill:#64748b}.sy-label{fill:#475569;font-size:11px}.sy-any text{fill:#64748b;font-style:italic}.sy-taken path{stroke:#4f46e5;stroke-width:2.5}@media (prefers-color-scheme:dark){.sy-diagram{color:#e2e8f0}.sy-state rect,.sy-state circle{fill:#0f172a;stroke:#94a3b8}.sy-compound>rect,.sy-parallel>rect{fill:#111827}.sy-active>rect,.sy-active>circle{fill:#312e81;stroke:#818cf8}.sy-label{fill:#cbd5e1}.sy-initial{fill:#cbd5e1}}</style>
