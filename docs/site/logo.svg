<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">switchyard</title>
  <style>
    .a { stop-color: #4f46e5; }
    .b { stop-color: #312e81; }
    @media (prefers-color-scheme: dark) {
      .a { stop-color: #818cf8; }
      .b { stop-color: #4338ca; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop class="a" offset="0"/>
      <stop class="b" offset="1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- a rail switch: one track in, two tracks out, a state at every end -->
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <path d="M32 50 V36"/>
    <path d="M32 36 C32 26 20 26 20 18" stroke-opacity="0.45"/>
    <path d="M32 36 C32 26 44 26 44 18"/>
  </g>
  <circle cx="32" cy="50" r="5" fill="#fff"/>
  <circle cx="20" cy="16" r="5" fill="#fff" fill-opacity="0.45"/>
  <circle cx="44" cy="16" r="5" fill="#fff"/>
</svg>
